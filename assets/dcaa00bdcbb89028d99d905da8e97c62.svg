<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="727.60532" height="433" viewBox="0,0,727.60532,433"><g transform="translate(43.36036,36.5)"><g stroke="none" stroke-miterlimit="10"><path d="M-43.36036,396.5v-433h717.44144v433z" fill="#272727" stroke-width="NaN"/><path d="M-38.87387,41.57143v-50h723.11883v50z" fill="#373737" stroke-width="0"/><image x="598.29558" y="47.40415" transform="scale(0.14925,0.14925)" width="180" height="180" xlink:href="data:image/png;base64," fill="none" stroke-width="0.5"/><text transform="translate(101.09482,82.77217) scale(0.69215,0.69215)" font-size="40" xml:space="preserve" fill="#ffffff" stroke-width="1" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Importing Gameplay</tspan></text><text transform="translate(92.45225,102.95686) scale(0.32284,0.32284)" font-size="40" xml:space="preserve" fill="#ffffff" stroke-width="1" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">In ZiKO adding an actual beatmap editor is like grabbing some cardboard </tspan><tspan x="0" dy="46.15px">and trying to make a mansion out of it. So we thought, what if we just use </tspan><tspan x="0" dy="46.15px">someone else’s editor and then import the gameplay? You’ll need either </tspan><tspan x="0" dy="46.15px">osu!stable or osu!lazer handy. When you start making a beatmap there, </tspan><tspan x="0" dy="46.15px">remember not to include:</tspan><tspan x="0" dy="46.15px"> </tspan><tspan x="0" dy="46.15px">- Curved sliders</tspan><tspan x="0" dy="46.15px">- Sliders with reverse arrows</tspan><tspan x="0" dy="46.15px">- Soft or drum hitsounds (soft-, drum-)</tspan><tspan x="0" dy="46.15px"> </tspan><tspan x="0" dy="46.15px">Once that’s done, open the beatmap externally and manually grab the .osu </tspan><tspan x="0" dy="46.15px">file to somewhere you’ll remember. Then use the .osu to .txt website you </tspan><tspan x="0" dy="46.15px">can find in the instructions, upload the .osu, copy the output, go back to </tspan><tspan x="0" dy="46.15px">the ZiKOEditor and press Import Gameplay.</tspan><tspan x="0" dy="46.15px">To play your ozu! beatmap, go to the beatmap selector and play the “</tspan><tspan x="0" dy="46.15px">Custom Beatmap” beatmap. After that, enjoy your beatmap!</tspan></text><text transform="translate(121.45806,25.00076) scale(0.32655,0.32655)" font-size="40" xml:space="preserve" fill="#ffffff" stroke-width="1" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">ZiKO</tspan></text><text transform="translate(150.42828,25.00076) scale(0.32655,0.32655)" font-size="40" xml:space="preserve" fill="#00ffb5" stroke-width="1" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Editor</tspan></text></g></g></svg>