</tspan><tspan x="0" dy="46.150000000000006px">support. Until now, i just have the </tspan><tspan x="0" dy="46.150000000000006px">UI done, doing the beatmap support</tspan><tspan x="0" dy="46.150000000000006px">will be as hard asf, so i publish the</tspan><tspan x="0" dy="46.150000000000006px">UI since it was the easiest part.</tspan><tspan x="0" dy="46.150000000000006px">Thanks for you pacience!</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">If you find a bug/glitch in the UI</tspan><tspan x="0" dy="46.150000000000006px">dont hesitate to comment it.</tspan><tspan x="0" dy="46.150000000000006px">I'm willing to fix any bug/glitch that</tspan><tspan x="0" dy="46.150000000000006px">user's report.</tspan><tspan x="0" dy="46.150000000000006px"> </tspan></text><path d="M440.35214,222.32279c-6.99314,-27.74084 9.82619,-55.89831 37.56704,-62.89145c27.74084,-6.99314 55.89831,9.82619 62.89145,37.56704c6.99314,27.74084 -9.82619,55.89831 -37.56704,62.89145c-27.74084,6.99314 -55.89831,-9.82619 -62.89145,-37.56704z" fill="url(#color-1)" stroke="#ffffff" stroke-width="6"/><text transform="translate(457.94827,233.00053) rotate(-14.1488) scale(0.98768,0.9572) skewX(0.0001)" font-size="40" xml:space="preserve" fill="url(#color-2)" stroke="none" stroke-width="1" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">ozu!</tspan></text><text transform="translate(455.14944,230.26897) rotate(-14.14894) scale(0.98767,0.95719) skewX(0.0001)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">ozu!</tspan></text><path d="M334.39547,233.88407c-11.04442,-19.68947 -6.09097,-43.45163 11.06385,-53.07429c17.15481,-9.62266 40.01481,-1.4619 51.05922,18.22757c11.04442,19.68947 6.09097,43.45163 -11.06385,53.07429c-17.15481,9.62266 -40.01481,1.4619 -51.05922,-18.22757z" fill="url(#color-3)" stroke="#ffffff" stro